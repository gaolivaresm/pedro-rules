<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a4a7a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>El Cielo se Cae</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☁️</text></svg>">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #07172e;
    color: #fff;
    font-family: sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 8px;
    overflow: hidden;
    touch-action: manipulation;
  }
  #ui { text-align: center; }
  #ui h2 { margin: 4px 0; font-size: clamp(16px, 4vw, 24px); }
  #ui p { margin: 2px 0; font-size: clamp(10px, 2.2vw, 14px); color: #cfe3ff; }

  /* El canvas guarda 800x500 internos (la física no cambia); en pantalla escala
     hasta el ancho disponible y hasta el alto que deje sitio a la UI. */
  #game {
    background: #0d2b52;
    border: 4px solid #2f5d8f;
    display: block;
    width: min(800px, 100%, calc((100dvh - 130px) * 1.6));
    max-width: 100%;
    height: auto;
    aspect-ratio: 8 / 5;
    touch-action: none;
  }
  #msg {
    font-size: clamp(14px, 3.4vw, 22px);
    min-height: 1.4em;
    text-align: center;
    max-width: 92vw;
  }
  #music-hint {
    font-size: clamp(10px, 2vw, 13px);
    color: #8fa8c8;
    margin: 0;
    text-align: center;
    max-width: 92vw;
  }

  /* ---------- Controles táctiles (solo en pantallas táctiles) ---------- */
  #touch {
    display: none;
    width: min(800px, 100%);
    gap: 10px;
    justify-content: space-between;
    align-items: center;
    margin-top: 4px;
    user-select: none;
    -webkit-user-select: none;
  }
  #touch .side { display: flex; gap: 10px; }
  #touch button {
    font-family: inherit;
    color: #fff;
    background: #2b4f7a;
    border: 3px solid #5f9fd6;
    border-radius: 16px;
    font-size: 30px;
    line-height: 1;
    width: 84px;
    height: 72px;
    touch-action: none;
    cursor: pointer;
  }
  #touch button.jump {
    background: #2a6b4f;
    border-color: #6fd6a0;
    width: 130px;
  }
  #touch button.active { background: #7fb6e8; }
  #touch button.jump.active { background: #4fbf8f; }
  @media (max-height: 560px) {
    #touch button { height: 58px; width: 72px; font-size: 24px; }
    #touch button.jump { width: 110px; }
  }
  /* Horizontal en teléfono: poco alto, se compacta todo para que quepa sin scroll */
  @media (max-height: 500px) {
    body { gap: 2px; padding: 2px 4px 0; justify-content: flex-start; }
    #ui h2 { font-size: 14px; margin: 0; }
    #ui p { display: none; }
    #game { width: min(800px, 100%, calc((100dvh - 92px) * 1.6)); }
    #msg { font-size: 13px; min-height: 0; }
    #music-hint { display: none; }
    #touch { gap: 6px; margin-top: 0; }
    #touch button { height: 46px; width: 64px; font-size: 20px; border-width: 2px; }
    #touch button.jump { width: 96px; }
    /* en horizontal el boton Inicio va en la fila del titulo, no encima del juego.
       (#ui #home-btn gana en especificidad al estilo base, que va despues) */
    #ui { position: relative; width: 100%; display: flex; justify-content: center; align-items: center; }
    #ui #home-btn {
      position: static;
      top: auto;
      left: auto;
      margin-right: auto;
      padding: 0 10px;
      min-width: 40px;
      min-height: 34px;
      font-size: 15px;
      border-width: 1px;
      display: inline-flex;
      justify-content: center;
    }
    #ui #home-btn .txt { display: none; }
  }
  /* Vertical en teléfono: sobra alto, botones grandes abajo para los pulgares */
  @media (max-height: 900px) and (orientation: portrait) and (min-width: 380px) and (max-width: 600px) {
    body { justify-content: space-between; padding: 6px 6px 10px; gap: 4px; }
    #ui h2 { font-size: 18px; margin: 2px 0; }
    #ui p { font-size: 10px; line-height: 1.3; }
    #msg { font-size: 15px; }
    #music-hint { font-size: 10px; line-height: 1.3; }
    #touch { margin-top: 0; }
    #touch button { width: 100px; height: 88px; font-size: 32px; }
    #touch button.jump { width: 150px; height: 88px; }
  }
  @media (orientation: portrait) and (max-width: 379px) {
    body { justify-content: space-between; padding: 4px; gap: 2px; }
    #ui h2 { font-size: 16px; margin: 0; }
    #ui p { font-size: 9px; line-height: 1.25; }
    #msg { font-size: 13px; }
    #music-hint { font-size: 9px; line-height: 1.25; }
    #touch button { width: 84px; height: 74px; font-size: 26px; }
    #touch button.jump { width: 120px; height: 74px; }
  }
  /* Boton para volver al selector de juegos */
  #home-btn {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 5;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    font: 600 clamp(12px, 2.4vw, 14px) system-ui, sans-serif;
    color: #fff;
    background: rgba(0, 0, 0, 0.55);
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-radius: 999px;
    cursor: pointer;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: background .15s ease, border-color .15s ease;
  }
  #home-btn:hover, #home-btn:focus-visible {
    background: rgba(0, 0, 0, 0.75);
    border-color: rgba(255, 255, 255, 0.75);
    outline: none;
  }
  #home-btn:active { transform: scale(0.96); }
  @media (max-width: 380px) {
    #home-btn { padding: 6px 10px; top: 6px; left: 6px; }
    #home-btn .txt { display: none; }
  }
</style>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const msgEl = document.getElementById('msg');

// ---- Física: idéntica a la ya validada en "El Piso es Lava" ----
const GRAVITY = 0.6;
const FRICTION = 0.85;
const MAX_JUMPS = 2;
const MAX_LEVEL = 10;
const MOVE_ACCEL = 0.6;
const MAX_SPEED = 5;
const JUMP_POWER = 12;
const COYOTE_FRAMES = 6;
const JUMP_BUFFER_FRAMES = 6;
const COYOTE_TOLERANCE = 6;
const STAR_VALUE = 10;
const RAINBOW_VALUE = 50;
const BREEZE_MS = 900;          // cuánto dura un empujón de brisa
const CLOUD_SINK = 4;           // cuánto se hunde una nube al pisarla

let keys = {};
let jumpPressed = false;
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp' && !keys['ArrowUp']) jumpPressed = true;
  keys[e.key] = true;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => keys[e.key] = false);
window.addEventListener('blur', () => { keys = {}; jumpPressed = false; });

// ---------- Controles táctiles (pointer events: touch, ratón, lápiz) ----------

const touchState = { ArrowLeft: new Set(), ArrowRight: new Set() };

function releaseKey(name, pointerId) {
  const set = touchState[name];
  if (set) {
    set.delete(pointerId);
    if (set.size > 0) return;
  }
  keys[name] = false;
}

function bindTouchButton(el, keyName) {
  if (!el) return;
  const onDown = e => {
    e.preventDefault();
    el.classList.add('active');
    if (keyName) {
      touchState[keyName].add(e.pointerId);
      keys[keyName] = true;
    } else {
      jumpPressed = true;
    }
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
  };
  const onUp = e => {
    el.classList.remove('active');
    if (keyName) releaseKey(keyName, e.pointerId);
  };
  el.addEventListener('pointerdown', onDown);
  el.addEventListener('pointerup', onUp);
  el.addEventListener('pointercancel', onUp);
  el.addEventListener('lostpointercapture', onUp);
  el.addEventListener('contextmenu', e => e.preventDefault());
}

function initTouchControls() {
  bindTouchButton(document.getElementById('btn-left'), 'ArrowLeft');
  bindTouchButton(document.getElementById('btn-right'), 'ArrowRight');
  bindTouchButton(document.getElementById('btn-jump'), null);

  const hasTouch = (navigator.maxTouchPoints || 0) > 0 ||
                   (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  const bar = document.getElementById('touch');
  if (bar && hasTouch) bar.style.display = 'flex';

  canvas.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') {
      e.preventDefault();
      jumpPressed = true;
    }
  });
}

function makePlayer() {
  return {
    x: 50, y: 50, w: 24, h: 24,
    vx: 0, vy: 0,
    onGround: false,
    frozen: false,
    color: '#ffe9a8',
    jumpsLeft: MAX_JUMPS,
    coyote: 0,
    jumpBuffer: 0
  };
}
const player = makePlayer();

const particles = [];
let flashUntil = 0;

let level = 1;
let score = 0;
let startX = 20, startY = 400;
let data = null;
let frame = 0;

// ---------- Generación de niveles ----------

function makeStar(x, y) {
  return { x, y, r: 9, collected: false };
}
// Nube: plataforma blanda. `sway` la mece suavemente en horizontal.
function makeCloud(x, y, w, sway) {
  return { kind: 'cloud', x, y, w, h: 20, sway: sway || 0,
           phase: Math.random() * Math.PI * 2, sink: 0, baseY: y, baseX: x };
}
// Pasarela: plancha firme de madera con cuerdas
function makeBridge(x, y, w) {
  return { kind: 'bridge', x, y, w, h: 14 };
}
// Rampa de nube: pendiente (se dibuja como una cuesta de nubes)
function makeRamp(x1, y1, x2, y2) {
  return { x1, y1, x2, y2 };
}
// Viento: zona con brisa que empuja (avisada con destello y sonido)
function makeBreeze(x, y, w, h, force) {
  return { x, y, w, h, force: force || -0.12, active: false, timer: 0 };
}

function getLevelData(lvl) {

}

// ---------- Audio (WebAudio, sin archivos externos) ----------

let audioCtx = null;
function beep(freq, duration, type, volume) {
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'triangle';
    osc.frequency.value = freq;
    const v = volume === undefined ? 0.06 : volume;
    gain.gain.setValueAtTime(v, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (err) {
    // Silencioso: si el navegador bloquea el audio, el juego sigue funcionando
  }
}

// ---------- Música de fondo (temas celestiales hechos en ReBirth) ----------
// Un tema distinto por nivel, todos alegres y con aire "celestial".

const MUSIC_THEMES = {

function musicThemeForLevel(lvl) {
  return MUSIC_THEMES[lvl] ? lvl : 1;
}

let music = null;
let musicOn = true;
let currentTheme = null;

function initMusic() {
  try {
    music = new Audio();
    music.loop = true;
    const tryPlay = () => {
      if (!music || !musicOn) return;
      const p = music.play();
      if (p && p.catch) p.catch(() => {});
    };
    document.addEventListener('keydown', tryPlay, { once: true });
    document.addEventListener('pointerdown', tryPlay, { once: true });
    playTheme(musicThemeForLevel(level));
  } catch (err) {
    music = null;
  }
}

function playTheme(name, restart) {
  const theme = MUSIC_THEMES[name];
  if (!music || !theme) return;
  if (currentTheme === name && !restart) return;
  currentTheme = name;
  music.pause();
  music.src = theme.url;
  music.loop = true;
  music.volume = theme.volume;
  music.currentTime = 0;
  if (musicOn) {
    const p = music.play();
    if (p && p.catch) p.catch(() => {});
  }
}

function playVictoryJingle() {
  if (!music || !musicOn) return;
  currentTheme = 'victory';
  music.pause();
  music.src = MUSIC_THEMES.victory.url;
  music.loop = false;
  music.volume = MUSIC_THEMES.victory.volume;
  music.currentTime = 0;
  const p = music.play();
  if (p && p.catch) p.catch(() => {});
  music.onended = () => playTheme(musicThemeForLevel(level), true);
}

function toggleMusic() {
  if (!music) return;
  musicOn = !musicOn;
  if (musicOn) {
    const p = music.play();
    if (p && p.catch) p.catch(() => {});
  } else {
    music.pause();
  }
  const hint = document.getElementById('music-hint');
  if (hint) hint.textContent = musicOn
    ? 'M = música on/off · música celestial hecha en ReBirth (RB-338)'
    : '🔇 música apagada · pulsa M para volver a encenderla';
}

// ---------- Partículas ----------

function spawnParticles(x, y, color, count, spread) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * (spread || 4),
      vy: -Math.random() * 3 - 1,
      life: 30 + Math.random() * 20,
      color,
      size: 2 + Math.random() * 3
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.10;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// ---------- Tumbo: el cuerpo sale girando al morir (estilo Stumble) ----------
const ragdolls = [];

function spawnRagdoll(x, y, color) {
  ragdolls.push({
    x, y,
    vx: (Math.random() - 0.5) * 9,
    vy: -7 - Math.random() * 4,
    rot: 0,
    spin: (Math.random() - 0.5) * 0.5,
    life: 70,
    color: color || player.color || '#ffffff',
    w: 24, h: 24
  });
}

function updateRagdolls() {
  for (let i = ragdolls.length - 1; i >= 0; i--) {
    const r = ragdolls[i];
    r.x += r.vx;
    r.y += r.vy;
    r.vy += 0.45;
    r.rot += r.spin;
    r.life--;
    if (r.life <= 0 || r.y > canvas.height + 60) ragdolls.splice(i, 1);
  }
}

function drawRagdolls() {
  for (const r of ragdolls) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, r.life / 40));
    ctx.translate(r.x + r.w / 2, r.y + r.h / 2);
    ctx.rotate(r.rot);
    ctx.fillStyle = r.color;
    ctx.fillRect(-r.w / 2, -r.h / 2, r.w, r.h);
    ctx.fillStyle = '#222';
    ctx.fillRect(-6, -4, 3, 3);
    ctx.fillRect(3, -4, 3, 3);
    ctx.restore();
  }
}

const PROGRESO_KEY = 'juego.' + (document.title || 'x').replace(/\s+/g, '_') + '.progreso';

function cargarProgreso() {
  try {
    const raw = localStorage.getItem(PROGRESO_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (typeof p.total === 'number') progreso.total = p.total;
      if (typeof p.coronas === 'number') progreso.coronas = p.coronas;
      if (typeof p.skin === 'string') progreso.skin = p.skin;
    }
  } catch (e) {}
  aplicarSkin();
}

function guardarProgreso() {
  try { localStorage.setItem(PROGRESO_KEY, JSON.stringify(progreso)); } catch (e) {}
}

function skinActual() {
  return SKINS.find(s => s.id === progreso.skin) || SKINS[0];
}

function skinDesbloqueada(s) { return progreso.total >= s.costo; }

function aplicarSkin() { player.color = skinActual().color; }

let totalAlEmpezar = 0;
function sumarProgreso(puntos) {
  progreso.total += puntos;
  guardarProgreso();
}

function elegirSkin(idx) {
  const s = SKINS[idx];
  if (!s || !skinDesbloqueada(s)) {
    msgEl.textContent = '🔒 Aun no la tienes: ' + (s ? s.costo + ' puntos acumulados' : '');
    msgEl.style.color = '#ff9ec4';
    setTimeout(() => { msgEl.textContent = ''; }, 1200);
    return;
  }
  progreso.skin = s.id;
  guardarProgreso();

  msgEl.style.color = s.color;

}

// ---------- Estado del nivel ----------

function loadLevel(lvl) {
  data = getLevelData(lvl);
  particles.length = 0;
  ragdolls.length = 0;
  resetPosition();
  resetRival();
  iniciarMarea();
}

function resetPosition() {
  player.x = startX;
  player.y = startY;
  player.vx = 0;
  player.vy = 0;
  player.jumpsLeft = MAX_JUMPS;
  player.frozen = false;
  player.onGround = false;
  player.coyote = 0;
  player.jumpBuffer = 0;
}

function rectsCollide(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function closestPointOnSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const lenSq = dx*dx + dy*dy;
  let t = lenSq === 0 ? 0 : ((px - x1) * dx + (py - y1) * dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  return { x: x1 + t * dx, y: y1 + t * dy, t };
}


// ---------- Rival bot (misma fisica, controlado por la maquina) ----------
const rival = {
  active: false, x: 0, y: 0, w: 24, h: 24,
  vx: 0, vy: 0, onGround: false, jumpsLeft: MAX_JUMPS,
  coyote: 0, color: '#ff8a4b', finished: false,
  finishFrame: 0, stuck: 0, lastX: 0, best: 0
};

function resetRival() {
  rival.active = true;
  rival.x = player.x + 34;
  rival.y = player.y - 6;
  rival.vx = 0; rival.vy = 0;
  rival.onGround = false;
  rival.jumpsLeft = MAX_JUMPS;
  rival.finished = false;
  rival.finishFrame = 0;
  rival.stuck = 0;
  rival.lastX = rival.x;
  rival.best = rival.x;
}

function updateRival() {
  if (!rival.active || rival.finished) return;

  const goalX = data.goal.x + data.goal.w / 2;
  const cx = rival.x + rival.w / 2;
  const dirRight = goalX > cx;

  if (dirRight) rival.vx += MOVE_ACCEL;
  else rival.vx -= MOVE_ACCEL;
  rival.vx = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, rival.vx));
  rival.vx *= FRICTION;
  if (Math.abs(rival.vx) < 0.05) rival.vx = 0;

  if (rival.onGround) rival.coyote = COYOTE_FRAMES;
  else if (rival.coyote > 0) rival.coyote--;

  const feet = rival.y + rival.h;
  let wantJump = false;
  if (rival.onGround) {
    const probeX = dirRight ? rival.x + rival.w + 8 : rival.x - 8;
    const probeY = feet + 2;
    const haySuelo = data.platforms.some(p =>
      !p.broken && probeX > p.x && probeX < p.x + p.w &&
      probeY >= p.y - 6 && probeY <= p.y + 14) ||
      data.slopes.some(s => {
        const c = closestPointOnSegment(probeX, probeY, s.x1, s.y1, s.x2, s.y2);
        return Math.hypot(probeX - c.x, probeY - c.y) < 18;
      });
    if (!haySuelo) wantJump = true;

    const g = data.goal;
    if (rival.x + rival.w > g.x && rival.x < g.x + g.w && feet > g.y + g.h) wantJump = true;
    if (rival.stuck > 20) wantJump = true;
  } else {
    if (rival.jumpsLeft > 0 && rival.vy > 1.5) wantJump = true;
  }

  if (wantJump && rival.jumpsLeft > 0) {
    rival.vy = rival.onGround ? -JUMP_POWER : -(JUMP_POWER * 0.92);
    rival.onGround = false;
    rival.coyote = 0;
    rival.jumpsLeft--;
  }

  rival.vy += (typeof gravityAt === 'function' ? gravityAt(rival.y) : GRAVITY);
  rival.x += rival.vx;
  rival.y += rival.vy;
  rival.onGround = false;

  for (const p of data.platforms) {
    if (p.broken) continue;
    const feetY = rival.y + rival.h;
    const prevFeetY = feetY - rival.vy;
    if (rival.x + rival.w > p.x && rival.x < p.x + p.w &&
        prevFeetY <= p.y + COYOTE_TOLERANCE && feetY >= p.y && rival.vy >= 0) {
      rival.y = p.y - rival.h;
      if (p.thin && !p.broken && p.crack === 0) p.crack = 22;
      rival.vy = 0;
      rival.onGround = true;
      rival.jumpsLeft = MAX_JUMPS;
    }
  }

  for (const s of data.slopes) {
    const fx = rival.x + rival.w / 2, fy = rival.y + rival.h;
    const c = closestPointOnSegment(fx, fy, s.x1, s.y1, s.x2, s.y2);
    if (Math.hypot(fx - c.x, fy - c.y) < 14 && rival.vy >= 0 && fy <= c.y + 16) {
      rival.y = c.y - rival.h;
      rival.vy = 0;
      rival.onGround = true;
      rival.jumpsLeft = MAX_JUMPS;
    }
  }

  if (rival.x < 0) rival.x = 0;
  if (rival.x + rival.w > canvas.width) rival.x = canvas.width - rival.w;

  if (rival.x > rival.best + 1) rival.best = rival.x;
  if (Math.abs(rival.x - rival.lastX) > 1.2) { rival.stuck = 0; rival.lastX = rival.x; }
  else rival.stuck++;

  if (rival.y > canvas.height + 40) {
    rival.x = Math.max(20, player.x - 60);
    rival.y = 300; rival.vx = 0; rival.vy = 0; rival.stuck = 0;
  }
  if (rival.stuck > 260) {
    rival.x = Math.min(goalX - 40, rival.best + 70);
    rival.y = 120; rival.vx = 0; rival.vy = 0; rival.stuck = 0;
  }

  const g = data.goal;
  const cercaX = rival.x + rival.w > g.x - 40 && rival.x < g.x + g.w + 40;
  const cercaY = Math.abs((rival.y + rival.h) - (g.y + g.h)) < 110;
  if (rectsCollide(rival.x, rival.y, rival.w, rival.h, g.x, g.y, g.w, g.h) ||
      (cercaX && cercaY)) {
    rival.finished = true;
    rival.finishFrame = frame;
  }
}

function drawRival() {
  if (!rival.active) return;
  ctx.save();
  if (!rival.onGround) { ctx.shadowColor = 'rgba(199, 138, 75, 0.9)'; ctx.shadowBlur = 10; }
  ctx.fillStyle = rival.color;
  ctx.fillRect(rival.x, rival.y, rival.w, rival.h);
  ctx.restore();
  const look = rival.vx > 0.5 ? 4 : (rival.vx < -0.5 ? 1 : 3);
  ctx.fillStyle = '#2a1a10';
  ctx.fillRect(rival.x + look, rival.y + 7, 3, 4);
  ctx.fillRect(rival.x + look + 6, rival.y + 7, 3, 4);
  ctx.fillStyle = 'rgba(230, 190, 150, 0.9)';
  ctx.font = '10px sans-serif';
  ctx.fillText('RIVAL', rival.x + 2, rival.y - 6);
}

// ---------- Modo eliminacion: el peligro sube solo ----------
const marea = {
  activa: false, y: 0, velocidad: 0.25,
  nombre: 'LA TORMENTA SUBE',
  c1: 'rgba(255, 200, 120, 0.85)', c2: 'rgba(200, 120, 90, 0.9)', c3: 'rgba(90, 60, 90, 0.95)'
};

function iniciarMarea() {
  marea.activa = (level >= MAX_LEVEL || level === 5);
  marea.y = canvas.height;
  marea.velocidad = 0.18 + level * 0.012;
}

function updateMarea() {
  if (!marea.activa) return;
  marea.y -= marea.velocidad;
  if (player.y + player.h > marea.y - 90 && frame % 40 === 0) {
    beep(220, 0.08, 'sawtooth', 0.02);
  }
  if (player.y + player.h > marea.y) {
    die('Te alcanzo! Corre mas rapido...');
    marea.y = canvas.height;
  }
}

function drawMarea() {
  if (!marea.activa) return;
  const alto = canvas.height - marea.y;
  if (alto <= 0) return;
  const g = ctx.createLinearGradient(0, marea.y, 0, canvas.height);
  g.addColorStop(0, marea.c1);
  g.addColorStop(0.4, marea.c2);
  g.addColorStop(1, marea.c3);
  ctx.fillStyle = g;
  ctx.fillRect(0, marea.y, canvas.width, alto);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
  ctx.beginPath();
  ctx.moveTo(0, marea.y);
  for (let x = 0; x <= canvas.width; x += 16) {
    ctx.lineTo(x, marea.y + Math.sin((x + frame * 3) * 0.03) * 4);
  }
  ctx.lineTo(canvas.width, marea.y + 10);
  ctx.lineTo(0, marea.y + 10);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 13px sans-serif';
  ctx.fillText('\uD83C\uDF0A ' + marea.nombre, canvas.width / 2 - 60, 20);
}

// ---------- Lógica principal ----------

// Las nubes se mecen despacio; al pisarlas se hunden un poco
function updateClouds() {
  for (const p of data.platforms) {
    // Solo las nubes se mecen y se hunden; las pasarelas son firmes
    if (p.kind !== 'cloud') continue;
    if (p.sway) {
      // se mueve, pero nunca se sale del lienzo
      const minX = 0, maxX = canvas.width - p.w;
      const want = p.baseX + Math.sin(frame * 0.012 + p.phase) * p.sway;
      p.x = Math.max(minX, Math.min(maxX, want));
    }
    // el hundimiento vuelve a 0 poco a poco
    if (p.sink > 0) p.sink = Math.max(0, p.sink - 0.4);
    p.y = p.baseY + p.sink;
  }
}

// Brisa: zonas que empujan al jugador con un pulso periódico
function updateBreezes() {
  for (const b of data.breezes || []) {
    b.timer = (b.timer || 0) + 1;
    const cycle = 260;                       // frames por ciclo
    const on = (b.timer % cycle) < 90;       // sopla 90 de cada 260 frames
    if (on && !b.active) beep(320, 0.18, 'sine', 0.025);
    b.active = on;
  }
}

function update() {
  frame++;
  updateRagdolls();
  updateRival();
  updateMarea();
  if (player.frozen) {
    updateClouds();
    updateBreezes();
    updateParticles();
    return;
  }

  // Movimiento horizontal con aceleración y tope de velocidad
  if (keys['ArrowLeft']) player.vx -= MOVE_ACCEL;
  if (keys['ArrowRight']) player.vx += MOVE_ACCEL;

  // La brisa empuja (si es una zona ascendente, también eleva un poco)
  for (const b of data.breezes || []) {
    if (b.active && rectsCollide(player.x, player.y, player.w, player.h, b.x, b.y, b.w, b.h)) {
      player.vx += b.force;
      if (b.force > 0 && Math.abs(b.force) > 0.15) player.vy -= 0.05;
    }
  }

  player.vx = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, player.vx));
  player.vx *= FRICTION;
  if (Math.abs(player.vx) < 0.05) player.vx = 0;

  // Coyote time y jump buffer
  if (player.onGround) player.coyote = COYOTE_FRAMES;
  else if (player.coyote > 0) player.coyote--;

  if (jumpPressed) player.jumpBuffer = JUMP_BUFFER_FRAMES;
  else if (player.jumpBuffer > 0) player.jumpBuffer--;

  if (player.jumpBuffer > 0 && player.jumpsLeft > 0) {
    const isAirJump = player.jumpsLeft === MAX_JUMPS - 1 && !player.onGround && player.coyote === 0;
    player.vy = isAirJump ? -(JUMP_POWER * 0.92) : -JUMP_POWER;
    player.onGround = false;
    player.coyote = 0;
    player.jumpBuffer = 0;
    player.jumpsLeft--;
    beep(isAirJump ? 720 : 560, 0.09, 'sine', 0.05);
    spawnParticles(player.x + player.w / 2, player.y + player.h, '#e8f6ff', 5, 3);
  }
  jumpPressed = false;

  player.vy += GRAVITY;
  player.x += player.vx;
  player.y += player.vy;

  updateClouds();

  const wasOnGround = player.onGround;
  player.onGround = false;

  for (const p of data.platforms) {
    const feetY = player.y + player.h;
    const prevFeetY = feetY - player.vy;
    if (
      player.x + player.w > p.x &&
      player.x < p.x + p.w &&
      prevFeetY <= p.y + COYOTE_TOLERANCE &&
      feetY >= p.y &&
      player.vy >= 0
    ) {
      player.y = p.y - player.h;
      if (p.kind === 'cloud') p.sink = CLOUD_SINK;   // la nube cede al pisarla
      player.vy = 0;
      player.onGround = true;
      player.jumpsLeft = MAX_JUMPS;
    }
  }

  for (const s of data.slopes) {
    const footX = player.x + player.w/2;
    const footY = player.y + player.h;
    const closest = closestPointOnSegment(footX, footY, s.x1, s.y1, s.x2, s.y2);
    const dist = Math.hypot(footX - closest.x, footY - closest.y);
    if (dist < 14 && player.vy >= 0 && footY <= closest.y + 16) {
      player.y = closest.y - player.h;
      player.vy = 0;
      player.onGround = true;
      player.jumpsLeft = MAX_JUMPS;
      const slopeDir = (s.x2 - s.x1) > 0 ? 1 : -1;
      const slopeSteepness = Math.abs((s.y2 - s.y1) / (s.x2 - s.x1));
      player.vx += slopeDir * slopeSteepness * 2.5;
    }
  }

  if (!wasOnGround && player.onGround) {
    spawnParticles(player.x + player.w / 2, player.y + player.h, '#ffffff', 4, 2);
  }

  if (player.x < 0) { player.x = 0; player.vx = 0; }
  if (player.x + player.w > canvas.width) { player.x = canvas.width - player.w; player.vx = 0; }

  // estrellas
  const cx = player.x + player.w/2, cy = player.y + player.h/2;
  for (const c of data.stars) {
    if (!c.collected && Math.hypot(cx - c.x, cy - c.y) < c.r + player.w/2) {
      c.collected = true;
      score += STAR_VALUE;
      beep(1040, 0.08, 'sine', 0.05);
      spawnParticles(c.x, c.y, '#fff3a8', 7, 4);
    }
  }

  // arcoíris
  const rb = data.rainbow;
  if (rb && !rb.collected && Math.hypot(cx - rb.x, cy - rb.y) < rb.r + player.w / 2) {
    rb.collected = true;
    score += RAINBOW_VALUE;
    beep(1560, 0.22, 'sine', 0.06);
    spawnParticles(rb.x, rb.y, '#ffd1f0', 14, 5);
  }

  updateBreezes();

  // Caer del cielo: el hueco entre nubes se lo traga
  if (player.y > canvas.height) {
    die('☁️ ¡Caíste del cielo! Vuelves al inicio...');
    return;
  }

  if (rectsCollide(player.x, player.y, player.w, player.h, data.goal.x, data.goal.y, data.goal.w, data.goal.h)) {
    win();
    return;
  }

  updateParticles();
}


// ---------- Fin de nivel, caída, reinicio ----------

function die(reason) {
  msgEl.textContent = reason || '☁️ ¡Caíste del cielo! Vuelves al inicio...';
  msgEl.style.color = '#ff9ec4';
  flashUntil = frame + 16;
  spawnRagdoll(player.x, player.y, player.color);
  beep(300, 0.35, 'sine', 0.05);
  setTimeout(() => beep(200, 0.3, 'sine', 0.04), 120);
  spawnParticles(player.x + player.w / 2,
                 Math.min(player.y + player.h / 2, canvas.height - 10),
                 '#cfe8ff', 16, 5);
  resetPosition();
  setTimeout(() => { msgEl.textContent = ''; }, 1000);
}

let running = true;

function win() {
  msgEl.style.color = '#a8ffcf';
  running = false;
  player.vx = 0;
  player.vy = 0;
  if (level >= MAX_LEVEL) {
    beep(660, 0.15, 'sine', 0.07);
    setTimeout(() => beep(880, 0.15, 'sine', 0.07), 160);
    setTimeout(() => beep(1180, 0.35, 'sine', 0.07), 320);
    playVictoryJingle();
    progreso.coronas++;
    sumarProgreso(score);
    msgEl.textContent = '🏆 ¡Pasaste las ' + MAX_LEVEL + ' nubes con ' + score + ' puntos! Presiona R para jugar otra vez.';
  } else {
    beep(700, 0.1, 'sine', 0.06);
    setTimeout(() => beep(1050, 0.18, 'sine', 0.06), 110);
    const nextLevel = level + 1;
    msgEl.textContent = '✅ ¡Nivel ' + level + ' superado! Subiendo a la nube ' + nextLevel + '...';
    setTimeout(() => {
      level = nextLevel;
      loadLevel(level);
      playTheme(musicThemeForLevel(level));   // cada nivel tiene su tema
      msgEl.textContent = '';
      running = true;
      requestAnimationFrame(loop);
    }, 1000);
  }
}

function restartGame() {
  level = 1;
  score = 0;
  msgEl.textContent = '';
  msgEl.style.color = '#a8ffcf';
  loadLevel(level);
  if (music) music.onended = null;
  playTheme(musicThemeForLevel(level), true);
  if (!running) {
    running = true;
    requestAnimationFrame(loop);
  }
}

document.addEventListener('keydown', e => {
  if ((e.key === 'r' || e.key === 'R') && !running) restartGame();
  if (e.key === 'm' || e.key === 'M') toggleMusic();
  if (e.key >= '1' && e.key <= '6') elegirSkin(parseInt(e.key, 10) - 1);
});


// ---------- Dibujo ----------

function drawBackground() {
  // Cielo: azul profundo arriba, claro y cálido abajo
  const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
  sky.addColorStop(0, '#123a6b');
  sky.addColorStop(0.55, '#3d7fbf');
  sky.addColorStop(1, '#b9ddf5');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Sol suave arriba a la derecha
  const sun = ctx.createRadialGradient(690, 70, 10, 690, 70, 120);
  sun.addColorStop(0, 'rgba(255, 246, 200, 0.85)');
  sun.addColorStop(1, 'rgba(255, 246, 200, 0)');
  ctx.fillStyle = sun;
  ctx.beginPath();
  ctx.arc(690, 70, 120, 0, Math.PI * 2);
  ctx.fill();

  // Nubes de fondo que derivan despacio (parallax)
  ctx.fillStyle = 'rgba(255, 255, 255, 0.16)';
  for (let i = 0; i < 5; i++) {
    const bx = ((frame * (0.15 + i * 0.05) + i * 190) % (canvas.width + 260)) - 130;
    const by = 60 + i * 42;
    puff(bx, by, 46 + i * 6);
  }
}

// Dibuja un grupo de tres puffs (nube suave y redondeada)
function puff(x, y, r, color) {
  if (color) ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.arc(x + r * 0.85, y - r * 0.25, r * 0.8, 0, Math.PI * 2);
  ctx.arc(x + r * 1.7, y, r * 0.95, 0, Math.PI * 2);
  ctx.fill();
}

function drawCloud(p) {
  const r = p.h;
  // sombra
  ctx.fillStyle = 'rgba(20, 60, 110, 0.28)';
  puff(p.x + 3, p.y - r * 0.55 + 4, r * 0.9);
  for (let i = 0; i < p.w; i += r * 1.3) {
    ctx.beginPath();
    ctx.arc(p.x + i + r, p.y + 4, r * 0.95, 0, Math.PI * 2);
    ctx.fill();
  }
  // cuerpo
  ctx.fillStyle = '#fbfdff';
  puff(p.x, p.y - r * 0.5, r);
  for (let i = 0; i < p.w; i += r * 1.35) {
    ctx.beginPath();
    ctx.arc(p.x + i + r, p.y, r * 0.95, 0, Math.PI * 2);
    ctx.fill();
  }
  // base donde se pisa
  ctx.fillRect(p.x, p.y - 2, p.w, r * 0.6);
  // brillo: un halo suave sobre las cimas de los puffs (redondeado, no una linea)
  const glow = ctx.createLinearGradient(0, p.y - r * 1.6, 0, p.y - r * 0.1);
  glow.addColorStop(0, 'rgba(255, 255, 255, 0.55)');
  glow.addColorStop(1, 'rgba(255, 255, 255, 0)');
  ctx.fillStyle = glow;
  puff(p.x, p.y - r * 0.5, r * 0.92);
  for (let i = 0; i < p.w; i += r * 1.35) {
    ctx.beginPath();
    ctx.arc(p.x + i + r, p.y, r * 0.87, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawBridge(p) {
  // cuerda lateral
  ctx.strokeStyle = '#7a5a34';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(p.x + 4, p.y - 12);
  ctx.lineTo(p.x + p.w - 4, p.y - 12);
  ctx.stroke();
  // tablas
  ctx.fillStyle = '#a9793f';
  ctx.fillRect(p.x, p.y, p.w, p.h);
  ctx.fillStyle = '#c9924f';
  ctx.fillRect(p.x, p.y, p.w, 4);
  ctx.strokeStyle = '#6d4a26';
  ctx.lineWidth = 1;
  for (let i = 6; i < p.w; i += 12) {
    ctx.beginPath();
    ctx.moveTo(p.x + i, p.y);
    ctx.lineTo(p.x + i, p.y + p.h);
    ctx.stroke();
  }
  // postes
  ctx.fillStyle = '#6d4a26';
  ctx.fillRect(p.x, p.y - 14, 4, 16);
  ctx.fillRect(p.x + p.w - 4, p.y - 14, 4, 16);
}

function drawRamp(s) {
  // rampa de nube: cuesta blanca con borde esponjoso
  ctx.fillStyle = '#eef8ff';
  ctx.beginPath();
  ctx.moveTo(s.x1, s.y1);
  ctx.lineTo(s.x2, s.y2);
  ctx.lineTo(s.x2, s.y2 + 22);
  ctx.lineTo(s.x1, s.y1 + 22);
  ctx.closePath();
  ctx.fill();
  const steps = 6;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const x = s.x1 + (s.x2 - s.x1) * t;
    const y = s.y1 + (s.y2 - s.y1) * t;
    ctx.beginPath();
    ctx.arc(x, y, 7, 0, Math.PI * 2);
    ctx.fill();
  }
}


function drawStar(c) {
  if (c.collected) return;
  const twinkle = 0.75 + Math.sin(frame * 0.12 + c.x * 0.1) * 0.25;
  const bob = Math.sin(frame * 0.08 + c.x * 0.05) * 2;
  const x = c.x, y = c.y + bob, r = c.r;
  ctx.save();
  ctx.shadowColor = 'rgba(255, 240, 150, ' + twinkle.toFixed(2) + ')';
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#fff3a8';
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const ang = -Math.PI / 2 + (Math.PI / 5) * i;
    const rad = i % 2 === 0 ? r : r * 0.45;
    const px = x + Math.cos(ang) * rad;
    const py = y + Math.sin(ang) * rad;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawRainbow(rb) {
  if (!rb || rb.collected) return;
  const bob = Math.sin(frame * 0.06) * 3;
  const cols = ['#ff6b6b', '#ffb36b', '#ffe36b', '#7be38a', '#6bc8ff', '#b58cff'];
  for (let i = 0; i < cols.length; i++) {
    ctx.strokeStyle = cols[i];
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(rb.x, rb.y + bob + 6, rb.r + i * 3, Math.PI, Math.PI * 2);
    ctx.stroke();
  }
}

function drawBreeze(b) {
  // zona de brisa: flechas de aire que se mueven en su dirección
  if (!b.active) return;
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.strokeStyle = '#eaf7ff';
  ctx.lineWidth = 2;
  const dir = b.force > 0 ? 1 : -1;
  for (let i = 0; i < 5; i++) {
    const y = b.y + 12 + i * (b.h / 5);
    const off = ((frame * 2.2 + i * 40) % (b.w + 60)) - 30;
    const x = dir > 0 ? b.x + off : b.x + b.w - off;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + dir * 16, y);
    ctx.moveTo(x + dir * 16, y);
    ctx.lineTo(x + dir * 10, y - 4);
    ctx.moveTo(x + dir * 16, y);
    ctx.lineTo(x + dir * 10, y + 4);
    ctx.stroke();
  }
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / 50);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}


function drawGoal(g) {
  // Portal de nube con borde dorado
  const glow = 0.5 + Math.sin(frame * 0.09) * 0.3;
  ctx.save();
  ctx.shadowColor = 'rgba(255, 230, 140, ' + glow.toFixed(2) + ')';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#fbfdff';
  ctx.fillRect(g.x, g.y, g.w, g.h);
  ctx.restore();
  ctx.strokeStyle = '#e8c25a';
  ctx.lineWidth = 3;
  ctx.strokeRect(g.x + 2, g.y + 2, g.w - 4, g.h - 4);
  ctx.fillStyle = '#7a5a1a';
  ctx.font = '12px sans-serif';
  ctx.fillText('META', g.x + 14, g.y + 30);
}

function drawPlayer() {
  ctx.save();
  if (!player.onGround) {
    ctx.shadowColor = 'rgba(255, 250, 200, 0.9)';
    ctx.shadowBlur = 12;
  }
  ctx.fillStyle = player.frozen ? '#ffb3d9' : player.color;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(player.x, player.y, player.w, player.h, 8);
  else ctx.rect(player.x, player.y, player.w, player.h);
  ctx.fill();
  ctx.restore();

  // ojos: miran hacia donde se mueve
  const look = player.vx > 0.5 ? 4 : (player.vx < -0.5 ? 1 : 3);
  ctx.fillStyle = '#28405c';
  ctx.fillRect(player.x + look, player.y + 7, 3, 4);
  ctx.fillRect(player.x + look + 6, player.y + 7, 3, 4);

  // saltos restantes
  if (!player.frozen) {
    for (let i = 0; i < player.jumpsLeft; i++) {
      ctx.fillStyle = 'rgba(255, 250, 210, 0.9)';
      ctx.fillRect(player.x + 4 + i * 7, player.y - 8, 5, 3);
    }
  }
}

function drawHUD() {
  ctx.fillStyle = '#ffffff';
  ctx.font = '16px sans-serif';
  ctx.fillText('Nube: ' + level + ' / ' + MAX_LEVEL, 10, 20);
  ctx.fillText('Puntos: ' + score, 10, 40);
  ctx.font = '12px sans-serif';
  ctx.fillStyle = skinActual().color;
  ctx.fillText('\uD83D\uDC51 ' + progreso.coronas + '  \u00b7  \u2b50 ' + progreso.total + ' acumulados', 10, 58);
  if (rival.active) {
    const gx = data.goal.x + data.goal.w / 2;
    const mi = player.x + player.w / 2, su = rival.x + rival.w / 2;
    let txt, col;
    if (rival.finished && rival.finishFrame <= frame) { txt = 'Rival primero'; col = '#ff9ec4'; }
    else if (Math.abs(mi - su) < 24) { txt = 'Rueda a rueda'; col = '#ffd166'; }
    else if (mi > su) { txt = 'Vas ganando'; col = '#9ff5b8'; }
    else { txt = 'Rival delante'; col = '#ff9ec4'; }
    ctx.fillStyle = col;
    ctx.fillText(txt, canvas.width - 165, 40);
    const bw = 140, bx = canvas.width - 165, by = 48;
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(bx, by, bw, 6);
    ctx.fillStyle = '#ffe680';
    ctx.fillRect(bx, by, Math.max(0, Math.min(1, mi / gx)) * bw, 6);
    ctx.fillStyle = rival.color;
    ctx.fillRect(bx, by, Math.max(0, Math.min(1, su / gx)) * bw, 2);
  }

  const total = data.stars.length;
  const got = data.stars.filter(c => c.collected).length;
  ctx.font = '14px sans-serif';
  ctx.fillStyle = '#fff3a8';
  ctx.fillText('⭐ ' + got + ' / ' + total, canvas.width - 90, 20);
}

function draw() {
  drawBackground();

  // brisas detrás de las plataformas
  for (const b of data.breezes || []) drawBreeze(b);

  for (const s of data.slopes) drawRamp(s);
  for (const p of data.platforms) {
    if (p.kind === 'bridge') drawBridge(p);
    else drawCloud(p);
  }
  for (const c of data.stars) drawStar(c);
  drawRainbow(data.rainbow);
  drawMarea();
  drawGoal(data.goal);
  drawRival();
  drawPlayer();
  drawRagdolls();
  drawParticles();
  drawHUD();

  if (frame < flashUntil) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
}

function loop() {
  if (!running) return;
  update();
  draw();
  requestAnimationFrame(loop);
}

cargarProgreso();
loadLevel(level);
initTouchControls();
initMusic();
loop();

// ---------- Volver al selector de juegos ----------
// Si hay una partida en curso, pregunta antes de salir (no perder el progreso
// de la partida por un toque accidental).
function confirmarSalida(e) {
  const enJuego = (typeof running !== 'undefined' && running) &&
                  (level > 1 || score > 0);
  if (enJuego && !confirm('¿Volver al inicio? Se pierde la partida actual (los puntos acumulados y los personajes se guardan).')) {
    if (e) e.preventDefault();
    return false;
  }
  return true;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' || e.key === 'h' || e.key === 'H') {
    if (confirmarSalida(null)) location.href = 'index.html';
  }
});

</script>
