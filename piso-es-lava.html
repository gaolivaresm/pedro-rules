<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a0800">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>El Piso es Lava</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌋</text></svg>">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #111;
    color: white;
    font-family: sans-serif;
    /* sin zoom ni scroll elástico accidental en móvil */
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 8px;
    overflow: hidden;
    touch-action: manipulation;
  }
  #ui { text-align: center; }
  #ui h2 { margin: 4px 0; font-size: clamp(16px, 4vw, 24px); }
  #ui p { margin: 2px 0; font-size: clamp(10px, 2.2vw, 14px); color: #ccc; }

  /* El canvas guarda 800x500 internos (la física no cambia); en pantalla escala
     hasta el ancho disponible y hasta el alto que deje sitio a la UI. */
  #game {
    background: #222;
    border: 4px solid #444;
    display: block;
    width: min(800px, 100%, calc((100dvh - 130px) * 1.6));
    max-width: 100%;
    height: auto;
    aspect-ratio: 8 / 5;
    touch-action: none;
  }
  #msg {
    font-size: clamp(14px, 3.4vw, 22px);
    min-height: 1.4em;
    text-align: center;
    max-width: 92vw;
  }
  #music-hint {
    font-size: clamp(10px, 2vw, 13px);
    color: #888;
    margin: 0;
    text-align: center;
    max-width: 92vw;
  }

  /* ---------- Controles táctiles (solo en pantallas táctiles) ---------- */
  #touch {
    display: none;
    width: min(800px, 100%);
    gap: 10px;
    justify-content: space-between;
    align-items: center;
    margin-top: 4px;
    user-select: none;
    -webkit-user-select: none;
  }
  #touch .side { display: flex; gap: 10px; }
  #touch button {
    font-family: inherit;
    color: #fff;
    background: #333;
    border: 3px solid #666;
    border-radius: 16px;
    font-size: 30px;
    line-height: 1;
    width: 84px;
    height: 72px;
    touch-action: none;
    cursor: pointer;
  }
  #touch button.jump {
    background: #3a5d20;
    border-color: #6fbf3f;
    width: 130px;
  }
  #touch button.active { background: #777; }
  #touch button.jump.active { background: #4d8a26; }
  /* En pantallas táctiles grandes los botones no deben dominar */
  @media (max-height: 560px) {
    #touch button { height: 58px; width: 72px; font-size: 24px; }
    #touch button.jump { width: 110px; }
  }
  /* Horizontal en teléfono: poco alto, se compacta todo para que quepa sin scroll */
  @media (max-height: 500px) {
    body { gap: 2px; padding: 4px; justify-content: flex-start; }
    #ui h2 { font-size: 14px; margin: 0; }
    #ui p { display: none; }
    #game { width: min(800px, 100%, calc((100dvh - 92px) * 1.6)); }
    #msg { font-size: 13px; min-height: 0; }
    #music-hint { display: none; }
    #touch { gap: 6px; margin-top: 0; }
    #touch button { height: 52px; width: 66px; font-size: 22px; border-width: 2px; }
    #touch button.jump { width: 100px; }
  }
  /* Vertical en teléfono: sobra alto (el ancho manda), se aprovecha para
     botones grandes abajo, donde llegan los pulgares. */
  @media (max-height: 900px) and (orientation: portrait) and (min-width: 380px) and (max-width: 600px) {
    body { justify-content: space-between; padding: 6px 6px 10px; gap: 4px; }
    #ui h2 { font-size: 18px; margin: 2px 0; }
    #ui p { font-size: 10px; line-height: 1.3; }
    #msg { font-size: 15px; }
    #music-hint { font-size: 10px; line-height: 1.3; }
    #touch { margin-top: 0; }
    #touch button { width: 100px; height: 88px; font-size: 32px; }
    #touch button.jump { width: 150px; height: 88px; }
  }
  /* Pantallas estrechas (360 px y menos): reparto el alto pero con botones que quepan */
  @media (orientation: portrait) and (max-width: 379px) {
    body { justify-content: space-between; padding: 4px; gap: 2px; }
    #ui h2 { font-size: 16px; margin: 0; }
    #ui p { font-size: 9px; line-height: 1.25; }
    #msg { font-size: 13px; }
    #music-hint { font-size: 9px; line-height: 1.25; }
    #touch button { width: 84px; height: 74px; font-size: 26px; }
    #touch button.jump { width: 120px; height: 74px; }
  }
  @media (min-width: 900px) and (pointer: fine) {
    #ui p, #music-hint { /* escritorio: todo el detalle */ }
  }
</style>
</head>
<body>

<div id="ui">
  <h2>🌋 El Piso es Lava 🌋</h2>
  <p>← → moverte · ↑ saltar (doble salto) · 🪙 monedas (+10) · ⚠️ celdas trampa · 🟥 lava móvil · 💎 gema (+50)</p>
</div>

<canvas id="game" width="800" height="500"></canvas>
<div id="msg"></div>

<div id="touch" aria-label="Controles táctiles">
  <div class="side">
    <button id="btn-left" type="button" aria-label="Izquierda">◀</button>
    <button id="btn-right" type="button" aria-label="Derecha">▶</button>
  </div>
  <div class="side">
    <button id="btn-jump" class="jump" type="button" aria-label="Saltar">⤒</button>
  </div>
</div>

<p id="music-hint" style="font-size:13px;color:#888;margin:6px 0 0">
  M = música on/off · la música es un loop hecho en ReBirth (RB-338)
</p>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const msgEl = document.getElementById('msg');

const GRAVITY = 0.6;
const FRICTION = 0.85;
const MAX_JUMPS = 2;
const MAX_LEVEL = 10;
const MOVE_ACCEL = 0.6;
const MAX_SPEED = 5;
const JUMP_POWER = 12;
// Coyote time: frames tras salir de una plataforma en los que aún puedes saltar
const COYOTE_FRAMES = 6;
// Jump buffer: frames que se "recuerda" un salto pulsado justo antes de aterrizar
const JUMP_BUFFER_FRAMES = 6;
const COYOTE_TOLERANCE = 6;      // margen (px) para considerar que estás sobre una plataforma
const COIN_VALUE = 10;
const GEM_VALUE = 50;
const TRAP_FREEZE_MS = 1000;

let keys = {};
let jumpPressed = false;
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp' && !keys['ArrowUp']) jumpPressed = true;
  keys[e.key] = true;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => keys[e.key] = false);

// Al perder el foco se limpian las teclas para evitar que el jugador "corra solo"
window.addEventListener('blur', () => { keys = {}; jumpPressed = false; });

// ---------- Controles táctiles ----------
// Se usan pointer events (cubren touch, ratón y lápiz) y se registra el puntero
// que sostiene cada botón, para que "mover" y "saltar" funcionen a la vez.

const touchState = { ArrowLeft: new Set(), ArrowRight: new Set() };

function pressKey(name) {
  keys[name] = true;
}

function releaseKey(name, pointerId) {
  // solo se suelta cuando no queda ningún puntero sobre ese botón
  const set = touchState[name];
  if (set) {
    set.delete(pointerId);
    if (set.size > 0) return;
  }
  keys[name] = false;
}

function bindTouchButton(el, action, keyName) {
  if (!el) return;

  const onDown = e => {
    e.preventDefault();
    el.classList.add('active');
    if (keyName) {
      touchState[keyName].add(e.pointerId);
      pressKey(keyName);
    } else {
      jumpPressed = true; // el salto se consume en el siguiente frame
    }
    // si el dedo se desliza fuera del botón, seguimos recibiendo el up
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
  };

  const onUp = e => {
    el.classList.remove('active');
    if (keyName) releaseKey(keyName, e.pointerId);
  };

  el.addEventListener('pointerdown', onDown);
  el.addEventListener('pointerup', onUp);
  el.addEventListener('pointercancel', onUp);
  el.addEventListener('lostpointercapture', onUp);
  // Sin esto, en móvil el navegador puede lanzar un "click" fantasma
  el.addEventListener('contextmenu', e => e.preventDefault());
}

function initTouchControls() {
  bindTouchButton(document.getElementById('btn-left'), 'left', 'ArrowLeft');
  bindTouchButton(document.getElementById('btn-right'), 'right', 'ArrowRight');
  bindTouchButton(document.getElementById('btn-jump'), 'jump', null);

  // La botonera solo se muestra donde hay puntero táctil
  const hasTouch = (navigator.maxTouchPoints || 0) > 0 ||
                   (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  const bar = document.getElementById('touch');
  if (bar && hasTouch) bar.style.display = 'flex';

  // Pulsar sobre el canvas también salta (cómodo en tablet)
  canvas.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') {
      e.preventDefault();
      jumpPressed = true;
    }
  });
}

function makePlayer() {
  return {
    x: 50, y: 50, w: 24, h: 24,
    vx: 0, vy: 0,
    onGround: false,
    frozen: false,
    color: '#ffcc00',
    jumpsLeft: MAX_JUMPS,
    coyote: 0,
    jumpBuffer: 0
  };
}
const player = makePlayer();

// Efectos visuales y de audio
const particles = [];
let flashUntil = 0;

let level = 1;
let score = 0;
let startX = 20, startY = 400;
let data = null;
let frame = 0;

// ---------- Utilidades ----------

function makeCoin(x, y) {
  return { x, y, r: 8, collected: false };
}
function makeTrap(x, y, w, h) {
  return { x, y, w, h };
}
// Lava móvil: rebota horizontalmente entre xMin y xMax
function makeLava(x, y, w, h, speed) {
  return { x, y, w, h, baseX: x, baseY: y, range: 60, speed: speed || 0.6, phase: 0, horizontal: true };
}

function rand(seed) {
  // PRNG determinista y ligero: cada nivel siempre es igual
  let s = seed * 9301 + 49297;
  return () => {
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
}
// ---------- Generación de niveles ----------

function handcraftedLevel(lvl) {
  if (lvl === 1) {
    return {
      platforms: [
        {x:0, y:460, w:180, h:40},
        {x:300, y:380, w:150, h:20},
        {x:550, y:300, w:150, h:20},
        {x:680, y:150, w:120, h:20},
      ],
      slopes: [
        {x1:180, y1:460, x2:300, y2:380},
      ],
      coins: [
        makeCoin(375, 350), makeCoin(625, 270), makeCoin(740, 120)
      ],
      traps: [],
      movingLava: [],
      gem: null,
      goal: {x:700, y:100, w:60, h:50}
    };
  }
  if (lvl === 2) {
    return {
      platforms: [
        {x:0, y:460, w:120, h:40},
        {x:250, y:420, w:100, h:20},
        {x:450, y:350, w:100, h:20},
        {x:250, y:250, w:100, h:20},
        {x:450, y:150, w:100, h:20},
        {x:680, y:80, w:120, h:20},
      ],
      slopes: [
        {x1:120, y1:460, x2:250, y2:420},
        {x1:550, y1:150, x2:680, y2:80},
      ],
      coins: [
        makeCoin(300, 390), makeCoin(500, 320), makeCoin(300, 220), makeCoin(740, 50)
      ],
      traps: [
        makeTrap(470, 330, 30, 20)
      ],
      movingLava: [],
      gem: null,
      goal: {x:700, y:30, w:60, h:50}
    };
  }
  if (lvl === 3) {
    return {
      platforms: [
        {x:0, y:460, w:100, h:40},
        {x:200, y:400, w:80, h:20},
        {x:380, y:330, w:80, h:20},
        {x:200, y:250, w:80, h:20},
        {x:380, y:180, w:80, h:20},
        {x:560, y:120, w:80, h:20},
        {x:700, y:60, w:100, h:20},
      ],
      slopes: [
        {x1:100, y1:460, x2:200, y2:400},
        {x1:460, y1:180, x2:560, y2:120},
      ],
      coins: [
        makeCoin(240, 370), makeCoin(420, 300), makeCoin(240, 220), makeCoin(600, 90)
      ],
      traps: [
        makeTrap(400, 160, 30, 20),
        makeTrap(220, 230, 30, 20)
      ],
      movingLava: [],
      gem: { x: 745, y: 20, r: 9, collected: false },
      goal: {x:720, y:10, w:60, h:50}
    };
  }
  return null;
}

// Generador procedural para niveles 4-10, cada vez un poco más exigente
function generatedLevel(lvl) {
  const rnd = rand(lvl * 77 + 13);
  const platforms = [{x:0, y:460, w:130, h:40}];
  const slopes = [{x1:130, y1:460, x2:250, y2:410}];
  const coins = [];
  const traps = [];
  const movingLava = [];

  const numPlatforms = 5 + lvl;              // más plataformas por nivel
  const vStep = Math.max(55, 105 - lvl * 3); // saltos algo más ajustados en niveles altos
  const pWidth = Math.max(65, 130 - lvl * 5);

  let curX = 250;
  let curY = 410;
  platforms.push({x: curX, y: curY, w: pWidth, h: 20});
  let dir = 1;

  for (let i = 1; i < numPlatforms; i++) {
    // En niveles altos el salto vertical puede ser irregular
    const jitter = lvl >= 5 ? Math.floor(rnd() * 16) : 0;
    curY -= Math.max(45, vStep - jitter);
    if (curY < 60) curY = 60;
    const horizontalJump = 105 + Math.floor(rnd() * (25 + lvl * 4));
    let targetX = dir === 1
      ? Math.min(720 - pWidth, curX + horizontalJump)
      : Math.max(10, curX - horizontalJump);
    dir *= -1;
    platforms.push({x: targetX, y: curY, w: pWidth, h: 20});

    // moneda flotando encima de casi todas las plataformas
    if (i % 2 === 0 || lvl >= 6) {
      coins.push(makeCoin(targetX + pWidth / 2, curY - 28));
    }

    // trampas a partir del nivel 4, más frecuentes en niveles altos
    const trapChance = lvl >= 7 ? 2 : 3;
    if (i > 1 && i % trapChance === 0) {
      traps.push(makeTrap(targetX + pWidth / 2 - 16, curY - 20, 32, 20));
    }

    // lava móvil que patrulla el hueco entre plataformas (nivel 6+)
    if (lvl >= 6 && i > 2 && i % 3 === 0) {
      const gapCenter = (curX + targetX) / 2 + pWidth / 2;
      movingLava.push(makeLava(gapCenter - 18, curY + 40, 36, 22, 0.5 + lvl * 0.03));
    }

    curX = targetX;
  }

  const last = platforms[platforms.length - 1];
  const goal = {x: Math.min(730, last.x + pWidth / 2 - 30), y: Math.max(10, last.y - 70), w: 60, h: 50};
  const gem = lvl >= 5 ? { x: goal.x + 30, y: Math.max(8, goal.y - 26), r: 9, collected: false } : null;

  return {platforms, slopes, coins, traps, movingLava, gem, goal};
}

function getLevelData(lvl) {
  return handcraftedLevel(lvl) || generatedLevel(lvl);
}
// ---------- Estado del nivel ----------

function loadLevel(lvl) {
  data = getLevelData(lvl);
  particles.length = 0;
  resetPosition();
}

function resetPosition() {
  player.x = startX;
  player.y = startY;
  player.vx = 0;
  player.vy = 0;
  player.jumpsLeft = MAX_JUMPS;
  player.frozen = false;
  player.onGround = false;
  player.coyote = 0;
  player.jumpBuffer = 0;
}

function rectsCollide(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function closestPointOnSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const lenSq = dx*dx + dy*dy;
  let t = lenSq === 0 ? 0 : ((px - x1) * dx + (py - y1) * dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  return { x: x1 + t * dx, y: y1 + t * dy, t };
}

// ---------- Audio (WebAudio, sin archivos externos) ----------

let audioCtx = null;
function beep(freq, duration, type, volume) {
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    const v = volume === undefined ? 0.06 : volume;
    gain.gain.setValueAtTime(v, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (err) {
    // Silencioso: si el navegador bloquea el audio, el juego sigue funcionando
  }
}

// ---------- Música de fondo (temas hechos en ReBirth) ----------

// Un tema por tramo de niveles; la fanfarria suena una vez al terminar el juego
const MUSIC_THEMES = {
  main: { url: 'musica/piso-es-lava.ogg', volume: 0.45 },
  final: { url: 'musica/piso-es-lava-final.ogg', volume: 0.5 },
  victory: { url: 'musica/piso-es-lava-victoria.ogg', volume: 0.55 }
};

function musicThemeForLevel(lvl) {
  return lvl >= MAX_LEVEL ? 'final' : 'main';
}

let music = null;
let musicOn = true;
let currentTheme = null;

function initMusic() {
  try {
    music = new Audio();
    music.loop = true;
    music.volume = MUSIC_THEMES.main.volume;
    // Si el navegador bloquea la reproducción automática, arranca al primer gesto.
    const tryPlay = () => {
      if (!music || !musicOn) return;
      const p = music.play();
      if (p && p.catch) p.catch(() => {});
    };
    document.addEventListener('keydown', tryPlay, { once: true });
    document.addEventListener('pointerdown', tryPlay, { once: true });
    playTheme(musicThemeForLevel(level));
  } catch (err) {
    music = null; // sin música: el juego sigue igual
  }
}

// Cambia de tema sin cortar en seco si ya era el tema actual
function playTheme(name, restart) {
  if (!music || !MUSIC_THEMES[name]) return;
  const theme = MUSIC_THEMES[name];
  if (currentTheme === name && !restart) return;
  currentTheme = name;
  music.pause();
  music.src = theme.url;
  music.loop = true;
  music.volume = theme.volume;
  music.currentTime = 0;
  if (musicOn) {
    const p = music.play();
    if (p && p.catch) p.catch(() => {});
  }
}

// Fanfarria: se toca una sola vez y luego vuelve la música de fondo
function playVictoryJingle() {
  if (!music || !musicOn) return;
  currentTheme = 'victory';
  music.pause();
  music.src = MUSIC_THEMES.victory.url;
  music.loop = false;
  music.volume = MUSIC_THEMES.victory.volume;
  music.currentTime = 0;
  const p = music.play();
  if (p && p.catch) p.catch(() => {});
  music.onended = () => {
    playTheme(musicThemeForLevel(level), true);
  };
}

function toggleMusic() {
  if (!music) return;
  musicOn = !musicOn;
  if (musicOn) {
    const p = music.play();
    if (p && p.catch) p.catch(() => {});
  } else {
    music.pause();
  }
  const hint = document.getElementById('music-hint');
  if (hint) hint.textContent = musicOn
    ? 'M = música on/off · la música es un loop hecho en ReBirth (RB-338)'
    : '🔇 música apagada · pulsa M para volver a encenderla';
}


function spawnParticles(x, y, color, count, spread) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * (spread || 4),
      vy: -Math.random() * 3 - 1,
      life: 30 + Math.random() * 20,
      color,
      size: 2 + Math.random() * 3
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.12;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function updateMovingLava() {
  for (const l of data.movingLava || []) {
    l.phase += l.speed * 0.03;
    const offset = Math.sin(l.phase) * l.range;
    if (l.horizontal) l.x = l.baseX + offset;
    else l.y = l.baseY + offset;
  }
}

// ---------- Lógica principal ----------

function update() {
  frame++;
  if (player.frozen) {
    updateMovingLava();
    updateParticles();
    return; // celda trampa activa: el jugador no se mueve
  }

  // Movimiento horizontal con aceleración y tope de velocidad
  if (keys['ArrowLeft']) player.vx -= MOVE_ACCEL;
  if (keys['ArrowRight']) player.vx += MOVE_ACCEL;
  player.vx = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, player.vx));
  player.vx *= FRICTION;
  if (Math.abs(player.vx) < 0.05) player.vx = 0;

  // Coyote time y jump buffer
  if (player.onGround) player.coyote = COYOTE_FRAMES;
  else if (player.coyote > 0) player.coyote--;

  if (jumpPressed) player.jumpBuffer = JUMP_BUFFER_FRAMES;
  else if (player.jumpBuffer > 0) player.jumpBuffer--;

  if (player.jumpBuffer > 0 && player.jumpsLeft > 0) {
    // El doble salto sube un poco menos que el salto desde el suelo
    const isAirJump = player.jumpsLeft === MAX_JUMPS - 1 && !player.onGround && player.coyote === 0;
    player.vy = isAirJump ? -(JUMP_POWER * 0.92) : -JUMP_POWER;
    player.onGround = false;
    player.coyote = 0;
    player.jumpBuffer = 0;
    player.jumpsLeft--;
    beep(isAirJump ? 520 : 400, 0.08, 'square', 0.05);
    spawnParticles(player.x + player.w / 2, player.y + player.h, '#ffe680', 4, 3);
  }
  jumpPressed = false;

  player.vy += GRAVITY;
  player.x += player.vx;
  player.y += player.vy;

  const wasOnGround = player.onGround;
  player.onGround = false;

  for (const p of data.platforms) {
    const feetY = player.y + player.h;
    const prevFeetY = feetY - player.vy;
    if (
      player.x + player.w > p.x &&
      player.x < p.x + p.w &&
      prevFeetY <= p.y + COYOTE_TOLERANCE &&
      feetY >= p.y &&
      player.vy >= 0
    ) {
      player.y = p.y - player.h;
      player.vy = 0;
      player.onGround = true;
      player.jumpsLeft = MAX_JUMPS;
    }
  }

  for (const s of data.slopes) {
    const footX = player.x + player.w/2;
    const footY = player.y + player.h;
    const closest = closestPointOnSegment(footX, footY, s.x1, s.y1, s.x2, s.y2);
    const dist = Math.hypot(footX - closest.x, footY - closest.y);
    if (dist < 14 && player.vy >= 0 && footY <= closest.y + 16) {
      player.y = closest.y - player.h;
      player.vy = 0;
      player.onGround = true;
      player.jumpsLeft = MAX_JUMPS;
      const slopeDir = (s.x2 - s.x1) > 0 ? 1 : -1;
      const slopeSteepness = Math.abs((s.y2 - s.y1) / (s.x2 - s.x1));
      player.vx += slopeDir * slopeSteepness * 2.5;
    }
  }

  if (!wasOnGround && player.onGround) {
    spawnParticles(player.x + player.w / 2, player.y + player.h, '#aaaaaa', 3, 2);
  }

  if (player.x < 0) { player.x = 0; player.vx = 0; }
  if (player.x + player.w > canvas.width) { player.x = canvas.width - player.w; player.vx = 0; }

  // monedas
  const cx = player.x + player.w/2, cy = player.y + player.h/2;
  for (const c of data.coins) {
    if (!c.collected && Math.hypot(cx - c.x, cy - c.y) < c.r + player.w/2) {
      c.collected = true;
      score += COIN_VALUE;
      beep(880, 0.07, 'triangle', 0.05);
      spawnParticles(c.x, c.y, '#ffdd33', 6, 4);
    }
  }

  // gema
  const g = data.gem;
  if (g && !g.collected && Math.hypot(cx - g.x, cy - g.y) < g.r + player.w / 2) {
    g.collected = true;
    score += GEM_VALUE;
    beep(1320, 0.18, 'sine', 0.07);
    spawnParticles(g.x, g.y, '#66ffff', 12, 5);
  }

  // lava móvil
  updateMovingLava();
  for (const l of data.movingLava || []) {
    if (rectsCollide(player.x, player.y, player.w, player.h, l.x, l.y, l.w, l.h)) {
      die('🔥 ¡La lava móvil te alcanzó!');
      return;
    }
  }

  // trampas
  for (const t of data.traps) {
    if (rectsCollide(player.x, player.y, player.w, player.h, t.x, t.y, t.w, t.h)) {
      trapHit();
      return;
    }
  }

  if (player.y > canvas.height) {
    die('🔥 ¡Te quemaste con la lava! Reiniciando...');
    return;
  }

  if (rectsCollide(player.x, player.y, player.w, player.h, data.goal.x, data.goal.y, data.goal.w, data.goal.h)) {
    win();
    return;
  }

  updateParticles();
}

// ---------- Fin de nivel, muerte, reinicio ----------

function trapHit() {
  player.frozen = true;
  player.vx = 0;
  player.vy = 0;
  beep(180, 0.25, 'sawtooth', 0.05);
  spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#cc66ff', 8, 4);
  msgEl.textContent = '⛓️ ¡Celda trampa! Te retiene un momento...';
  msgEl.style.color = '#cc66ff';
  setTimeout(() => {
    msgEl.textContent = '↩️ Vuelves al inicio del nivel.';
    resetPosition();
    setTimeout(() => { msgEl.textContent = ''; }, 800);
  }, TRAP_FREEZE_MS);
}

function die(reason) {
  msgEl.textContent = reason || '🔥 ¡Te quemaste con la lava! Reiniciando...';
  msgEl.style.color = '#ff5555';
  flashUntil = frame + 16;
  beep(120, 0.3, 'sawtooth', 0.06);
  spawnParticles(player.x + player.w / 2,
                 Math.min(player.y + player.h / 2, canvas.height - 10),
                 '#ff6600', 14, 5);
  resetPosition();
  setTimeout(() => { msgEl.textContent = ''; }, 1000);
}

let running = true;

function win() {
  msgEl.style.color = '#55ff88';
  running = false;
  player.vx = 0;
  player.vy = 0;
  if (level >= MAX_LEVEL) {
    beep(660, 0.15, 'triangle', 0.07);
    setTimeout(() => beep(990, 0.3, 'triangle', 0.07), 160);
    playVictoryJingle();   // fanfarria de ReBirth al completar los 10 niveles
    msgEl.textContent = '🏆 ¡Completaste los ' + MAX_LEVEL + ' niveles con ' + score + ' puntos! Presiona R para reiniciar.';
  } else {
    beep(700, 0.1, 'triangle', 0.06);
    setTimeout(() => beep(1050, 0.16, 'triangle', 0.06), 110);
    const nextLevel = level + 1;
    msgEl.textContent = '✅ ¡Nivel ' + level + ' superado! Cargando nivel ' + nextLevel + '...';
    setTimeout(() => {
      level = nextLevel;
      loadLevel(level);
      playTheme(musicThemeForLevel(level));   // el nivel 10 estrena tema propio
      msgEl.textContent = '';
      running = true;
      requestAnimationFrame(loop);
    }, 1000);
  }
}

// Reinicia la partida completa (al terminar el juego, con la tecla R)
function restartGame() {
  level = 1;
  score = 0;
  msgEl.textContent = '';
  msgEl.style.color = '#55ff88';
  loadLevel(level);
  if (music) music.onended = null;
  playTheme(musicThemeForLevel(level), true);
  if (!running) {
    running = true;
    requestAnimationFrame(loop);
  }
}

document.addEventListener('keydown', e => {
  if ((e.key === 'r' || e.key === 'R') && !running) restartGame();
  if (e.key === 'm' || e.key === 'M') toggleMusic();
});

// ---------- Dibujo ----------

function drawSlopePolygon(s) {
  ctx.fillStyle = '#8899ff';
  ctx.beginPath();
  ctx.moveTo(s.x1, s.y1);
  ctx.lineTo(s.x2, s.y2);
  ctx.lineTo(s.x2, s.y2 + 20);
  ctx.lineTo(s.x1, s.y1 + 20);
  ctx.closePath();
  ctx.fill();
}

function drawCoin(c) {
  if (c.collected) return;
  const bob = Math.sin(frame * 0.08 + c.x * 0.05) * 2;
  ctx.fillStyle = '#ffdd33';
  ctx.beginPath();
  ctx.arc(c.x, c.y + bob, c.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#a37b00';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawGem(g) {
  if (!g || g.collected) return;
  const bob = Math.sin(frame * 0.06) * 3;
  const cx = g.x, cy = g.y + bob;
  ctx.fillStyle = '#66ffff';
  ctx.beginPath();
  ctx.moveTo(cx, cy - g.r);
  ctx.lineTo(cx + g.r, cy);
  ctx.lineTo(cx, cy + g.r);
  ctx.lineTo(cx - g.r, cy);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function drawTrap(t) {
  ctx.fillStyle = '#7a1fa2';
  ctx.fillRect(t.x, t.y, t.w, t.h);
  ctx.strokeStyle = '#e0b3ff';
  ctx.lineWidth = 2;
  ctx.strokeRect(t.x, t.y, t.w, t.h);
  ctx.fillStyle = '#e0b3ff';
  ctx.font = '12px sans-serif';
  ctx.fillText('⚠', t.x + t.w/2 - 6, t.y + t.h/2 + 5);
}

function drawMovingLava(l) {
  const pulse = 0.6 + Math.abs(Math.sin(frame * 0.1 + l.phase)) * 0.4;
  ctx.fillStyle = '#ff3300';
  ctx.fillRect(l.x, l.y, l.w, l.h);
  ctx.fillStyle = 'rgba(255, 220, 80, ' + (pulse * 0.7).toFixed(3) + ')';
  ctx.fillRect(l.x + 3, l.y + 3, l.w - 6, 6);
  ctx.strokeStyle = '#ffaa00';
  ctx.lineWidth = 2;
  ctx.strokeRect(l.x, l.y, l.w, l.h);
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / 50);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawGoal(g) {
  const glow = 0.55 + Math.sin(frame * 0.09) * 0.25;
  ctx.save();
  ctx.shadowColor = 'rgba(51, 204, 102, ' + glow.toFixed(3) + ')';
  ctx.shadowBlur = 18;
  ctx.fillStyle = '#33cc66';
  ctx.fillRect(g.x, g.y, g.w, g.h);
  ctx.restore();
  ctx.fillStyle = 'white';
  ctx.font = '12px sans-serif';
  ctx.fillText('META', g.x + 8, g.y + 28);
}

function drawBackground() {
  ctx.fillStyle = '#2a0800';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Rayas diagonales que "fluyen" hacia arriba
  const shift = (frame * 0.7) % 30;
  ctx.strokeStyle = '#ff4400';
  ctx.lineWidth = 2;
  for (let i = -30; i < canvas.width + 30; i += 30) {
    ctx.beginPath();
    ctx.moveTo(i + shift, 0);
    ctx.lineTo(i + shift + 15, canvas.height);
    ctx.stroke();
  }

  // Brillo cálido del fondo de lava
  const grad = ctx.createLinearGradient(0, canvas.height - 140, 0, canvas.height);
  grad.addColorStop(0, 'rgba(255, 80, 0, 0)');
  grad.addColorStop(1, 'rgba(255, 80, 0, 0.35)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, canvas.height - 140, canvas.width, 140);
}

function drawPlatforms() {
  for (const p of data.platforms) {
    ctx.fillStyle = '#777';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = '#999';
    ctx.fillRect(p.x, p.y, p.w, 5);
  }
}

function drawPlayer() {
  ctx.save();
  if (!player.onGround) {
    ctx.shadowColor = 'rgba(255, 220, 0, 0.8)';
    ctx.shadowBlur = 12;
  }
  ctx.fillStyle = player.frozen ? '#ff88ff' : player.color;
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.restore();

  // Ojos: miran hacia donde se mueve el personaje
  const look = player.vx > 0.5 ? 4 : (player.vx < -0.5 ? 1 : 3);
  ctx.fillStyle = '#222';
  ctx.fillRect(player.x + look, player.y + 7, 3, 4);
  ctx.fillRect(player.x + look + 6, player.y + 7, 3, 4);

  // Indicador de saltos restantes
  if (!player.frozen) {
    for (let i = 0; i < player.jumpsLeft; i++) {
      ctx.fillStyle = 'rgba(255, 230, 120, 0.85)';
      ctx.fillRect(player.x + 4 + i * 7, player.y - 8, 5, 3);
    }
  }
}

function drawHUD() {
  ctx.fillStyle = 'white';
  ctx.font = '16px sans-serif';
  ctx.fillText('Nivel: ' + level + ' / ' + MAX_LEVEL, 10, 20);
  ctx.fillText('Puntos: ' + score, 10, 40);

  const total = data.coins.length;
  const got = data.coins.filter(c => c.collected).length;
  ctx.font = '14px sans-serif';
  ctx.fillStyle = '#ffdd33';
  ctx.fillText('🪙 ' + got + ' / ' + total, canvas.width - 90, 20);
}

function draw() {
  drawBackground();
  drawPlatforms();
  for (const s of data.slopes) drawSlopePolygon(s);
  for (const c of data.coins) drawCoin(c);
  drawGem(data.gem);
  for (const t of data.traps) drawTrap(t);
  for (const l of data.movingLava || []) drawMovingLava(l);
  drawGoal(data.goal);
  drawPlayer();
  drawParticles();
  drawHUD();

  // Destello rojo al morir
  if (frame < flashUntil) {
    ctx.fillStyle = 'rgba(255, 60, 0, 0.35)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
}

function loop() {
  if (!running) return;
  update();
  draw();
  requestAnimationFrame(loop);
}

loadLevel(level);
initTouchControls();
initMusic();
loop();
</script>
